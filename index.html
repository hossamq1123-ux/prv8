<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST FOR RORO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
<!-- الشاشة الأولى: المقلب (خطأ 404) -->
    <div id="fake-error" class="screen">
        <!-- خلفية فيديو واقعية للمطر -->
        <video autoplay muted loop playsinline class="bg-video">
            <!-- رابط فيديو مطر غزير وواقعي (مؤقت حتى تضع الفيديو الخاص بك) -->
            <source src="https://cdn.pixabay.com/video/2020/05/25/40141-426177118_large.mp4" type="video/mp4">
        </video>
        
        <!-- طبقة شفافة سوداء لتوضيح النص فوق الفيديو -->
        <div class="video-overlay"></div>

        <div class="error-container">
            <h3>Error 404</h3>
            <p>النظام خرب ياكهلة كبرتي!</p>
        </div>
    </div>
    
    <!-- الشاشة الثانية: شاشة فك الشفرة (كلمة السر) -->
    <div id="password-screen" class="screen flex-center hidden">
        <div class="lock-container">
            <h2>;كلمة سر منك وفيك حليها </h2>
            <p>يلا يا مواليد 2002 اكتبي هنا:</p>
            <input type="password" id="password-input" placeholder="مثال: 1205 (يوم وشهر)">
            <button id="unlock-btn">افتح القفل</button>
            <p id="error-msg" class="error-text hidden">هذا وانتي حارثية حليتيها خطأ!</p>
        </div>
    </div>

    <!-- الشاشة الثالثة: المحتوى الرئيسي (الترحيب) -->
    <div id="main-content" class="screen hidden">
        <!-- سنضيف تأثير الآلة الكاتبة والألعاب هنا لاحقاً -->
        <h1 id="welcome-text"></h1>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
