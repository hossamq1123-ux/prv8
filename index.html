<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST FOR RORO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- الشاشة الأولى: المقلب (خطأ 404) -->
    <div id="fake-error" class="screen">
        <video autoplay muted loop playsinline class="bg-video">
            <!-- غيّرنا الرابط عشان ما يعلق، يرجى وضع فيديو rain.mp4 في مجلد assets لاحقاً -->
            <source src="assets/rain.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>

        <div class="glass-card error-card">
            <h3 class="glitch-text">Error 404</h3>
            <p>حتى النظام خرب ياكهلة كبرتي ما شاء الله</p>
        </div>
    </div>
    
    <!-- الشاشة الثانية: شاشة فك الشفرة (كلمة السر) -->
    <div id="password-screen" class="screen flex-center hidden">
        <div class="glass-card lock-container">
            <div class="icon-glow">🔒</div>
            <h2>كلمة سر منك وفيك حليها</h2>
            <p class="subtitle">يلا يا مواليد 2002 اكتبي هنا:</p>
            <input type="password" id="password-input" class="modern-input" placeholder="تبين المح لك بعد !! مافييييييه">
            <button id="unlock-btn" class="modern-btn">افتح القفل</button>
            <p id="error-msg" class="error-text hidden">هذا وانتي حارثية حليتيها خطأ!</p>
        </div>
    </div>

    <!-- الشاشة الثالثة: المحتوى الرئيسي (الترحيب) -->
    <div id="main-content" class="screen flex-center hidden">
        <div class="glass-card welcome-container">
            
            <!-- أزرار الموسيقى والتحكم بالصوت -->
            <div class="music-controls hidden" id="music-controls">
                <p class="subtitle"> اغاني على ذوقك </p>
                <div class="btn-group">
                    <button id="serious-music-btn" class="modern-btn outline"> اغنية رايقة </button>
                    <button id="funny-music-btn" class="modern-btn outline"> افضل اغنية عندك </button>
                </div>
                <!-- التحكم بالصوت -->
                <div class="volume-container">
                    <span>🔊</span>
                    <input type="range" id="volume-control" class="modern-slider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>
            
            <!-- رسالة الترحيب وأزرار المقلب -->
            <div class="message-box">
                <!-- أزرار المقلب المتسلسلة -->
                <button id="prank-btn-1" class="modern-btn hidden" style="margin-top: 20px;">رسالة خاصة لك</button>
                <button id="prank-btn-2" class="modern-btn hidden" style="margin-top: 20px;">قلنا خاصة افهمي </button>
                <button id="prank-btn-3" class="modern-btn hidden" style="margin-top: 20px;"> لازم بروبوقاندا عشان تفتح </button>
                
                <h1 id="welcome-text"></h1>
            </div>

            <!-- زر الانتقال للعبة -->
            <button id="next-game-btn" class="modern-btn pulse-btn hidden"> يتم تغييرها الى رساله من فتات الميلاد شخصياً </button>
        </div>

        <!-- ملفات الصوت -->
        <audio id="serious-audio" src="assets/serious.mp3" loop></audio>
        <audio id="funny-audio" src="assets/funny.mp3" loop></audio>
    </div>

    <!-- الشاشة الرابعة: رحلة المنطاد عبر التمرير (النسخة السينمائية) -->
    <div id="game-screen" class="screen hidden balloon-screen">
        <div class="scroll-journey" id="scroll-journey">
            
            <!-- خلفية السماء والنجوم الواقعية -->
            <div class="journey-bg"></div>
            <div class="stars-layer" id="stars-layer"></div>

            <!-- المنطاد الحقيقي -->
            <div class="hot-air-balloon" id="hot-air-balloon">
                <!-- تأكد من وجود الصورة في مجلد assets -->
                <img src="assets/balloon.png" alt="Balloon" id="balloon-img">
            </div>

            <!-- إرشادات البداية -->
            <div class="scroll-indicator" id="scroll-indicator">
                <p>اسحبي المنطاد عشان تروحي لك</p>
                <div class="arrow-down">⬇️</div>
            </div>

            <!-- نهاية الرحلة (القمر الواقعي) -->
            <div class="space-destination">
                <div class="realistic-moon" id="realistic-moon"></div>
                <div class="final-message glass-card" id="final-message">
                    <h2>وصلتي لك </h2>
                    <p>أنتِ قمرنا اللي منور دنيتنا، كل عام وأنتِ بخير يا أحلى وأغلى من كبر!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
