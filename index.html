<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST FOR RORO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- الشاشة الأولى: المقلب (خطأ 404) -->
    <div id="fake-error" class="screen">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="https://cdn.pixabay.com/video/2020/05/25/40141-426177118_large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>

        <div class="glass-card error-card">
            <h3 class="glitch-text">Error 404</h3>
            <p>حتى النظام خرب ياكهلة كبرتي ما شاء الله</p>
        </div>
    </div>
    
    <!-- الشاشة الثانية: شاشة فك الشفرة (كلمة السر) -->
    <div id="password-screen" class="screen flex-center hidden">
        <div class="glass-card lock-container">
            <div class="icon-glow">🔒</div>
            <h2>كلمة سر منك وفيك حليها</h2>
            <p class="subtitle">يلا يا مواليد 2002 اكتبي هنا:</p>
            <input type="password" id="password-input" class="modern-input" placeholder="تبين المح لك بعد !! مافييييييه">
            <button id="unlock-btn" class="modern-btn">افتح القفل</button>
            <p id="error-msg" class="error-text hidden">هذا وانتي حارثية حليتيها خطأ!</p>
        </div>
    </div>

    <!-- الشاشة الثالثة: المحتوى الرئيسي (الترحيب) -->
    <div id="main-content" class="screen flex-center hidden">
        <div class="glass-card welcome-container">
            
            <!-- أزرار الموسيقى والتحكم بالصوت -->
            <div class="music-controls hidden" id="music-controls">
                <p class="subtitle">اختاري المود قبل ما تقرين:</p>
                <div class="btn-group">
                    <button id="serious-music-btn" class="modern-btn outline">موسيقى هادية 🎵</button>
                    <button id="funny-music-btn" class="modern-btn outline">موسيقى فصلة 🤪</button>
                </div>
                <!-- التحكم بالصوت بتصميم حديث -->
                <div class="volume-container">
                    <span>🔊</span>
                    <input type="range" id="volume-control" class="modern-slider" min="0" max="1" step="0.1" value="0.5">
                </div>
            </div>
            
            <!-- رسالة الترحيب -->
            <div class="message-box">
                <h1 id="welcome-text"></h1>
            </div>

            <!-- زر الانتقال للعبة -->
            <button id="next-game-btn" class="modern-btn pulse-btn hidden">جاهزة للتحدي؟ 👀</button>
        </div>

        <!-- ملفات الصوت -->
        <audio id="serious-audio" src="assets/serious.mp3" loop></audio>
        <audio id="funny-audio" src="assets/funny.mp3" loop></audio>
    </div>

    <!-- الشاشة الرابعة: لعبة الأسئلة (مجهزة للتصميم الحديث) -->
    <div id="game-screen" class="screen flex-center hidden">
        <div class="glass-card quiz-container">
            <h2>لعبة الأسئلة 🧠</h2>
            <p class="subtitle">التصميم الحديث جاهز لاستقبال الأسئلة...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
